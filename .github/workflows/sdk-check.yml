name: SDK checks
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
permissions:
  contents: read
# Every job runs on our ephemeral k3s scale set ci-sdk-verify (class sdk, Ubuntu 24.04, no sudo), never on a
# GitHub-hosted runner (owner order 2026-11-04). Toolchains come from setup-* into the job's tool cache; PHP comes
# from the static-php.dev CLI builds (setup-php needs root on a self-hosted runner).
jobs:
  node:
    name: node ${{ matrix.node }}
    runs-on: ci-sdk-verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  deno:
    runs-on: ci-sdk-verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: npm install --no-audit --no-fund
      - run: npm run test:deno -w @busymate/ai-verify

  python:
    name: python ${{ matrix.python }}
    runs-on: ci-sdk-verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install cryptography
      - run: python -m unittest -q test_vectors
        working-directory: snippets/python

  php:
    name: php ${{ matrix.php }}
    runs-on: ci-sdk-verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.1", build: "8.1.34" }
          - { php: "8.3", build: "8.3.32" }
    steps:
      - uses: actions/checkout@v4
      - name: PHP ${{ matrix.build }} CLI (static build, openssl built in)
        env:
          PHP_BUILD: ${{ matrix.build }}
        run: |
          mkdir -p "$RUNNER_TEMP/php"
          curl -fsSL --retry 3 "https://dl.static-php.dev/static-php-cli/common/php-$PHP_BUILD-cli-linux-x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP/php"
          echo "$RUNNER_TEMP/php" >> "$GITHUB_PATH"
      - run: php -v && php -m | grep -qix openssl
      - run: php snippets/php/test_vectors.php

  go:
    name: go ${{ matrix.go }}
    runs-on: ci-sdk-verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ["1.21", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ matrix.go }}" }
      - run: go vet ./... && go test ./...
        working-directory: snippets/go

  vectors:
    name: vectors in sync with the identity contract
    runs-on: ci-sdk-verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Vectors are not hand-edited and match the contract
        run: node scripts/sync-vectors.mjs --check
        env:
          BMAI_CONTRACT_VECTORS: ${{ vars.BMAI_CONTRACT_VECTORS }}

  pack:
    name: pack and smoke-test the tarballs from a clean directory
    runs-on: ci-sdk-verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node scripts/pack-all.mjs
      - name: Clean-machine smoke test
        run: |
          set -e
          D=$(mktemp -d); cd "$D"
          npx --yes --package="$(ls "$GITHUB_WORKSPACE"/release/busymate-identity-check-*.tgz)" identity-check --help | head -3
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/release/busymate-ai-verify-[0-9]*.tgz
          node -e "import('@busymate/ai-verify').then(m=>{ if(typeof m.verifyBusymateActor!=='function') process.exit(1); console.log('ai-verify imports ok') })"
      - uses: actions/upload-artifact@v4
        with: { name: release, path: release/ }

  sdk-check:
    if: ${{ always() && !cancelled() }}  # a cancelled run must not turn the gate red
    needs: [node, deno, python, php, go, vectors, pack]
    runs-on: ci-sdk-verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: No GitHub-hosted runners (runs-on lint)
        run: python3 .github/runs-on-lint.py
      - name: All SDK checks passed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
