name: Release
# Push a tag equal to the package version (e.g. 0.1.0) after sdk-check is green on main.
# Creates the GitHub release with tarballs and SHA256SUMS. Publishes to npm only when the NPM_TOKEN secret exists.
on:
  push:
    tags: ["[0-9]*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Tag matches the package version
        run: |
          V=$(node -p "require('./packages/ai-verify/package.json').version")
          C=$(node -p "require('./packages/identity-check/package.json').version")
          test "$GITHUB_REF_NAME" = "$V" && test "$V" = "$C" || { echo "tag $GITHUB_REF_NAME != package versions $V / $C"; exit 1; }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm test
      - run: node scripts/pack-all.mjs
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk -v v="$GITHUB_REF_NAME" '$0 ~ "^## "v"$"{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes "$NOTES

          SHA-256:
          $(cat release/SHA256SUMS)"
          fi
      - name: Publish to npm (skipped when NPM_TOKEN is not set)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set: skipping npm publish (GitHub release only)"; exit 0; fi
          npm publish -w @busymate/ai-verify --access public
          npm publish -w @busymate/identity-check --access public
